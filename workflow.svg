<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="How hn-scraper works: fetch page, parse posts, find next page, save to CSV" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3de0d0"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b7cff"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#0c1017"/>
  <text x="45" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6eaf2">How it works</text>

  <!-- error note -->
  <rect x="300" y="62" width="420" height="40" rx="8" fill="none" stroke="#8b7cff" stroke-dasharray="5 4"/>
  <text x="510" y="87" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b9b1ff">Request error: stop paging, keep posts collected so far</text>
  <line x1="370" y1="102" x2="370" y2="138" stroke="#8b7cff" stroke-dasharray="5 4" marker-end="url(#arr2)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- node 1 -->
    <rect x="45" y="140" width="190" height="120" rx="12" fill="#141a26" stroke="#2a3447"/>
    <text x="140" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#e6eaf2">Hacker News</text>
    <text x="140" y="208" text-anchor="middle" font-size="14" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#9aa5b8">news.ycombinator.com</text>
    <text x="140" y="236" text-anchor="middle" font-size="14" fill="#6f7a8f">start page</text>

    <!-- node 2 -->
    <rect x="275" y="140" width="190" height="120" rx="12" fill="#141a26" stroke="#2a3447"/>
    <text x="370" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#3de0d0" font-family="Consolas, 'SF Mono', Menlo, monospace">fetch_page</text>
    <text x="370" y="208" text-anchor="middle" font-size="14" fill="#9aa5b8">requests.get</text>
    <text x="370" y="236" text-anchor="middle" font-size="14" fill="#6f7a8f">timeout 10 s</text>

    <!-- node 3 -->
    <rect x="505" y="140" width="190" height="120" rx="12" fill="#141a26" stroke="#2a3447"/>
    <text x="600" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#3de0d0" font-family="Consolas, 'SF Mono', Menlo, monospace">parse_stories</text>
    <text x="600" y="208" text-anchor="middle" font-size="14" fill="#9aa5b8">BeautifulSoup</text>
    <text x="600" y="236" text-anchor="middle" font-size="14" fill="#6f7a8f">title + link per post</text>

    <!-- node 4 -->
    <rect x="735" y="140" width="190" height="120" rx="12" fill="#141a26" stroke="#2a3447"/>
    <text x="830" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#3de0d0" font-family="Consolas, 'SF Mono', Menlo, monospace">get_next_page_url</text>
    <text x="830" y="208" text-anchor="middle" font-size="14" fill="#9aa5b8">finds the "More" link</text>
    <text x="830" y="236" text-anchor="middle" font-size="14" fill="#6f7a8f">pause --delay seconds</text>

    <!-- node 5 -->
    <rect x="965" y="140" width="190" height="120" rx="12" fill="#141a26" stroke="#3de0d0"/>
    <text x="1060" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#3de0d0" font-family="Consolas, 'SF Mono', Menlo, monospace">save_to_csv</text>
    <text x="1060" y="208" text-anchor="middle" font-size="14" fill="#9aa5b8">hn_data.csv</text>
    <text x="1060" y="236" text-anchor="middle" font-size="14" fill="#6f7a8f">title, link, scraped_at</text>
  </g>

  <!-- arrows -->
  <g stroke="#3de0d0" stroke-width="2" fill="none">
    <line x1="237" y1="200" x2="273" y2="200" marker-end="url(#arr)"/>
    <line x1="467" y1="200" x2="503" y2="200" marker-end="url(#arr)"/>
    <line x1="697" y1="200" x2="733" y2="200" marker-end="url(#arr)"/>
    <line x1="927" y1="200" x2="963" y2="200" marker-end="url(#arr)"/>
  </g>
  <text x="945" y="190" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6f7a8f">done</text>

  <!-- loop back -->
  <path d="M830 262 V330 H370 V264" fill="none" stroke="#3de0d0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="600" y="358" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9aa5b8">next page exists and --pages not reached: repeat</text>
</svg>
