<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Example run of hn-scraper and the resulting CSV (example data)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="400" rx="16" fill="#0c1017"/>
  <text x="45" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6eaf2">Example output</text>
  <rect x="215" y="32" width="300" height="28" rx="14" fill="none" stroke="#8b7cff"/>
  <text x="365" y="51" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b9b1ff">example data, made up for illustration</text>

  <!-- terminal -->
  <rect x="45" y="85" width="500" height="270" rx="12" fill="#10151f" stroke="#2a3447"/>
  <rect x="45" y="85" width="500" height="34" rx="12" fill="#1a2231"/>
  <rect x="45" y="107" width="500" height="12" fill="#1a2231"/>
  <circle cx="68" cy="102" r="5" fill="#3a4357"/>
  <circle cx="86" cy="102" r="5" fill="#3a4357"/>
  <circle cx="104" cy="102" r="5" fill="#3a4357"/>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="65" y="155" fill="#e6eaf2"><tspan fill="#3de0d0">$</tspan> python scraper.py --pages 2 --output hn_data.csv</text>
    <text x="65" y="185" fill="#9aa5b8">Скачиваю страницу 1: https://news.ycombinator.com/</text>
    <text x="65" y="207" fill="#9aa5b8">  Найдено постов: 30</text>
    <text x="65" y="237" fill="#9aa5b8">Скачиваю страницу 2: https://news.ycombinator.com/?p=2</text>
    <text x="65" y="259" fill="#9aa5b8">  Найдено постов: 30</text>
    <text x="65" y="299" fill="#3de0d0">Готово! Сохранено 60 постов в файл: hn_data.csv</text>
  </g>

  <!-- csv table -->
  <rect x="575" y="85" width="580" height="270" rx="12" fill="#10151f" stroke="#2a3447"/>
  <rect x="575" y="85" width="580" height="40" rx="12" fill="#1a2231"/>
  <rect x="575" y="113" width="580" height="12" fill="#1a2231"/>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="595" y="111" fill="#3de0d0">title</text>
    <text x="790" y="111" fill="#3de0d0">link</text>
    <text x="955" y="111" fill="#3de0d0">scraped_at</text>

    <text x="595" y="157" fill="#e6eaf2">Example post title one</text>
    <text x="790" y="157" fill="#9aa5b8">https://example.org/1</text>
    <text x="955" y="157" fill="#9aa5b8">2026-01-01T12:00:00+00:00</text>
    <line x1="595" y1="175" x2="1135" y2="175" stroke="#1f2736"/>

    <text x="595" y="203" fill="#e6eaf2">Example post title two</text>
    <text x="790" y="203" fill="#9aa5b8">https://example.org/2</text>
    <text x="955" y="203" fill="#9aa5b8">2026-01-01T12:00:00+00:00</text>
    <line x1="595" y1="221" x2="1135" y2="221" stroke="#1f2736"/>

    <text x="595" y="249" fill="#e6eaf2">Example post title three</text>
    <text x="790" y="249" fill="#9aa5b8">https://example.org/3</text>
    <text x="955" y="249" fill="#9aa5b8">2026-01-01T12:00:00+00:00</text>
    <line x1="595" y1="267" x2="1135" y2="267" stroke="#1f2736"/>

    <text x="595" y="295" fill="#6f7a8f">...</text>
    <text x="595" y="337" fill="#6f7a8f">hn_data.csv</text>
  </g>
</svg>
