<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="hn-scraper: collects Hacker News posts into a CSV file" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1017"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3de0d0"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#glow)"/>

  <text x="60" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#e6eaf2">hn-scraper</text>
  <text x="60" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9aa5b8">Collects Hacker News posts into a CSV file.</text>
  <text x="60" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#6f7a8f">Titles, links and timestamps. One command, any number of pages.</text>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" fill="#3de0d0">
    <rect x="60" y="244" width="86" height="34" rx="17" fill="none" stroke="#2a3447"/>
    <text x="103" y="266" text-anchor="middle">Python</text>
    <rect x="158" y="244" width="104" height="34" rx="17" fill="none" stroke="#2a3447"/>
    <text x="210" y="266" text-anchor="middle">requests</text>
    <rect x="274" y="244" width="152" height="34" rx="17" fill="none" stroke="#2a3447"/>
    <text x="350" y="266" text-anchor="middle">BeautifulSoup</text>
  </g>

  <!-- CSV preview, right side -->
  <g transform="translate(700 62)">
    <rect width="440" height="196" rx="12" fill="#10151f" stroke="#2a3447"/>
    <rect width="440" height="40" rx="12" fill="#1a2231"/>
    <rect y="28" width="440" height="12" fill="#1a2231"/>
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15">
      <text x="20" y="26" fill="#3de0d0">title</text>
      <text x="190" y="26" fill="#3de0d0">link</text>
      <text x="300" y="26" fill="#3de0d0">scraped_at</text>
    </g>
    <g fill="#2a3447">
      <rect x="20" y="62" width="130" height="10" rx="5"/>
      <rect x="190" y="62" width="80" height="10" rx="5"/>
      <rect x="300" y="62" width="120" height="10" rx="5"/>
      <rect x="20" y="98" width="100" height="10" rx="5"/>
      <rect x="190" y="98" width="90" height="10" rx="5"/>
      <rect x="300" y="98" width="120" height="10" rx="5"/>
      <rect x="20" y="134" width="150" height="10" rx="5"/>
      <rect x="190" y="134" width="70" height="10" rx="5"/>
      <rect x="300" y="134" width="120" height="10" rx="5"/>
    </g>
    <text x="20" y="178" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#6f7a8f">hn_data.csv</text>
  </g>
</svg>
